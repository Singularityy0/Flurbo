<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" role="img" aria-labelledby="title desc">
  <title id="title">Flurbo landscape brand banner</title>
  <desc id="desc">An ivory institutional banner with the Copula Contour identity and Flurbo's shared-pool positioning.</desc>
  <rect width="2400" height="1350" fill="#f5f4ec"/>
  <path d="M0 0h28v1350H0z" fill="#14271d"/>

  <g transform="translate(122 92) scale(.94)" fill="none" stroke="#14271d" stroke-linecap="round" stroke-linejoin="round">
    <path stroke-width="4.8" d="M11 19C18 7 39 5 51 14c10 8 7 29-4 38-11 10-31 4-39-9-6-10-3-18 3-24Z"/>
    <path stroke-width="4.8" d="M20 19c8-6 22-4 27 5 5 9-2 20-12 23-10 3-20-3-21-13-1-6 1-11 6-15Z"/>
    <path stroke-width="5.8" d="M27 27c6-4 14 0 14 7-1 6-9 9-14 5-5-4-5-9 0-12Z"/>
  </g>
  <text x="197" y="143" fill="#14271d" font-family="Space Grotesk, Arial, sans-serif" font-size="55" font-weight="560" letter-spacing="-3.3">flurbo</text>
  <text x="2030" y="136" fill="#5c665f" font-family="Space Grotesk, Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="3.4">MONAD TESTNET</text>

  <text x="122" y="406" fill="#5c665f" font-family="Space Grotesk, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="5.5">COMBINATORIAL PREDICTION MARKETS</text>
  <text x="116" y="580" fill="#14271d" font-family="Space Grotesk, Arial, sans-serif" font-size="146" font-weight="560" letter-spacing="-9">Price the</text>
  <text x="116" y="725" fill="#14271d" font-family="Cormorant Garamond, Georgia, serif" font-size="182" font-weight="400" font-style="italic" letter-spacing="-8">relationship.</text>
  <text x="122" y="832" fill="#5c665f" font-family="Space Grotesk, Arial, sans-serif" font-size="36">Individual and combined predictions priced from</text>
  <text x="122" y="882" fill="#5c665f" font-family="Space Grotesk, Arial, sans-serif" font-size="36">one shared pool.</text>

  <rect x="122" y="1002" width="382" height="70" rx="35" fill="#14271d"/>
  <text x="172" y="1048" fill="#f5f4ec" font-family="Space Grotesk, Arial, sans-serif" font-size="23" font-weight="600">Invite-based testnet</text>
  <text x="122" y="1224" fill="#14271d" font-family="Space Grotesk, Arial, sans-serif" font-size="26" font-weight="560">flurbo.singu.online</text>
  <text x="2014" y="1224" fill="#5c665f" font-family="Space Grotesk, Arial, sans-serif" font-size="22">Test assets only</text>

  <g transform="translate(1500 236) scale(14.5)" fill="none" stroke="#14271d" stroke-linecap="round" stroke-linejoin="round" opacity=".98">
    <path stroke-width="1.12" d="M11 19C18 7 39 5 51 14c10 8 7 29-4 38-11 10-31 4-39-9-6-10-3-18 3-24Z"/>
    <path stroke-width="1.12" d="M20 19c8-6 22-4 27 5 5 9-2 20-12 23-10 3-20-3-21-13-1-6 1-11 6-15Z"/>
    <path stroke-width="1.36" d="M27 27c6-4 14 0 14 7-1 6-9 9-14 5-5-4-5-9 0-12Z"/>
  </g>
  <circle cx="2113" cy="1108" r="9" fill="#d9f76d"/>
